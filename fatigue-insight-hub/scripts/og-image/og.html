<!doctype html>
<!--
  Source of public/og-image.png (1200x630 social preview). Render with render.py.
  PAIRS must match LANDING_ROUTE_PAIRS in src/components/landing/landingData.ts
  (src/test/landing-data.test.ts checks this), so the preview and the hero
  globe show the same neutral multi-hub network.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter'; font-weight: 400 700; src: url('/fonts/inter-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-weight: 400; src: url('/fonts/instrument-serif-latin.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400 600; src: url('/fonts/jetbrains-mono-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Inter', sans-serif; color: #142e45;
    background:
      radial-gradient(52% 70% at 78% 50%, #d3e6ef 0%, #d3e6ef00 70%),
      radial-gradient(40% 50% at 0% 0%, #f8fbfd 0%, #f8fbfd00 70%),
      linear-gradient(180deg, #eef4f7 0%, #e6eff4 100%);
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 70px; width: 610px; }
  .logo { height: 38px; filter: brightness(0.35) contrast(1.4) saturate(1.2); }
  .eyebrow { margin-top: 54px; font-size: 16px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #087478; }
  h1 { margin: 18px 0 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 84px; line-height: 1.0; letter-spacing: -0.02em; }
  .sub { margin-top: 26px; font-size: 22px; line-height: 1.45; color: #425d73; max-width: 540px; }
  .scale { position: absolute; left: 72px; bottom: 64px; width: 470px; }
  .scale .track { position: relative; height: 10px; border-radius: 99px; background: linear-gradient(90deg, #aab7c4 0 calc(56.25% - 2px), #eef4f7 0 56.25%, #d19a00 0 calc(68.75% - 2px), #eef4f7 0 68.75%, #c7511a 0 calc(81.25% - 2px), #eef4f7 0 81.25%, #a21650 0 calc(93.75% - 2px), #eef4f7 0 93.75%, #7d0f3d 0 100%); }
  .scale .ticks { display: flex; justify-content: space-between; margin-top: 10px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #526579; position: relative; height: 18px; }
  .scale .ticks span { position: absolute; transform: translateX(-50%); }
  .scale .label { margin-bottom: 12px; font-size: 15px; color: #304a5f; font-weight: 500; }
  #globe { position: absolute; right: 26px; top: 20px; }
  .url { position: absolute; right: 60px; bottom: 30px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #526579; }
</style>
</head>
<body>
  <div class="copy">
    <img class="logo" src="/logo.png" alt="" />
    <div class="eyebrow">For line pilots · Built on published sleep science</div>
    <h1>Know your roster before you fly it.</h1>
    <div class="sub">Predicted sleepiness for every duty, body-clock timing and scoped EASA ORO.FTL checks.</div>
  </div>
  <div class="scale">
    <div class="label">Karolinska Sleepiness Scale, 1–9</div>
    <div class="track"></div>
    <div class="ticks"><span style="left:0%;transform:none">1</span><span style="left:56.25%">5.5</span><span style="left:68.75%">6.5</span><span style="left:81.25%">7.5</span><span style="left:93.75%">8.5</span></div>
  </div>
  <svg id="globe" width="560" height="590"></svg>
  <div class="url">aerowake.madebylantern.xyz</div>
<script src="/node/d3-array/dist/d3-array.min.js"></script>
<script src="/node/d3-geo/dist/d3-geo.min.js"></script>
<script src="/node/topojson-client/dist/topojson-client.min.js"></script>
<script>
(async () => {
  const land = await (await fetch('/node/world-atlas/land-110m.json')).json();
  const LAND = topojson.feature(land, land.objects.land);
  const W = 560, H = 590, cx = W / 2, cy = H / 2 + 6, R = 228;
  const rot = [-42, -18, 0];
  const projection = d3.geoOrthographic().scale(R).translate([cx, cy]).rotate(rot).clipAngle(90);
  const path = d3.geoPath(projection);
  const svg = document.getElementById('globe');
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs, parent = svg) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n; };
  const defs = el('defs', {});
  const grad = (id, stops, attrs) => { const g = el('radialGradient', { id, ...attrs }, defs); stops.forEach(([o, c, a]) => el('stop', { offset: o, 'stop-color': c, 'stop-opacity': a }, g)); };
  grad('atm', [[0.86, '#6fc0db', 0.5], [0.94, '#9fd6e8', 0.14], [1, '#9fd6e8', 0]], { cx: '50%', cy: '50%', r: '50%' });
  grad('ocean', [[0, '#f1f9fb', 1], [0.55, '#c6e0ea', 1], [1, '#8fb6c6', 1]], { cx: '38%', cy: '32%', r: '75%' });
  grad('shade', [[0, '#ffffff', 0.4], [0.45, '#ffffff', 0], [1, '#0b2c3f', 0.3]], { cx: '36%', cy: '30%', r: '80%' });
  el('circle', { cx, cy, r: R * 1.16, fill: 'url(#atm)' });
  el('circle', { cx, cy, r: R, fill: 'url(#ocean)' });
  el('path', { d: path(d3.geoGraticule().step([15, 15])()), fill: 'none', stroke: '#ffffff', 'stroke-opacity': 0.5, 'stroke-width': 0.8 });
  el('path', { d: path(LAND), fill: '#6f98aa', 'fill-opacity': 0.55, stroke: '#ffffff', 'stroke-opacity': 0.45, 'stroke-width': 0.6 });
  el('circle', { cx, cy, r: R, fill: 'url(#shade)' });
  el('circle', { cx, cy, r: R, fill: 'none', stroke: '#9fc3d2', 'stroke-width': 1 });

  const AIR = { LHR: [-0.46, 51.47], CDG: [2.55, 49.01], FRA: [8.57, 50.03], FCO: [12.25, 41.8], IST: [28.73, 41.28], DOH: [51.57, 25.26], DXB: [55.36, 25.25], BOM: [72.87, 19.09], DEL: [77.1, 28.56], BKK: [100.75, 13.69], SIN: [103.99, 1.35], NRT: [140.39, 35.77], JNB: [28.24, -26.14], NBO: [36.93, -1.32] };
  // A neutral multi-hub network: no single carrier's schedule. Every pair
  // stays on the visible hemisphere at this rotation, so no arc crosses the limb.
  const PAIRS = [['CDG', 'JNB'], ['LHR', 'DXB'], ['CDG', 'SIN'], ['FRA', 'NRT'], ['IST', 'BKK'], ['DOH', 'BOM'], ['FCO', 'DEL'], ['JNB', 'DXB'], ['NBO', 'IST'], ['DOH', 'LHR']];
  const rotate = d3.geoRotation(rot);
  const toRad = Math.PI / 180;
  for (const [fromCode, toCode] of PAIRS) {
    const a = AIR[fromCode], b = AIR[toCode];
    const d = d3.geoDistance(a, b);
    const h = 0.04 + 0.18 * Math.min(1, d / Math.PI);
    const n = Math.max(24, Math.ceil(d * 80));
    const interp = d3.geoInterpolate(a, b);
    let front = '', back = '', penF = false, penB = false;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const [lam, phi] = rotate(interp(t)).map((v) => v * toRad);
      const lift = 1 + h * Math.sin(Math.PI * t);
      const x = Math.cos(phi) * Math.sin(lam), y = Math.sin(phi), z = Math.cos(phi) * Math.cos(lam);
      const hidden = z < 0 && lift * Math.hypot(x, y) <= 1;
      const sx = cx + R * lift * x, sy = cy - R * lift * y;
      if (hidden) { back += `${penB ? 'L' : 'M'}${sx.toFixed(1)} ${sy.toFixed(1)}`; penB = true; penF = false; }
      else { front += `${penF ? 'L' : 'M'}${sx.toFixed(1)} ${sy.toFixed(1)}`; penF = true; penB = false; }
    }
    el('path', { d: path({ type: 'LineString', coordinates: [a, b] }) || '', fill: 'none', stroke: '#0b2c3f', 'stroke-opacity': 0.1, 'stroke-width': 1 });
    if (back) el('path', { d: back, fill: 'none', stroke: '#0e6f86', 'stroke-opacity': 0.18, 'stroke-width': 1.4, 'stroke-dasharray': '2 4' });
    el('path', { d: front, fill: 'none', stroke: '#f4fbfd', 'stroke-width': 4.5, 'stroke-linecap': 'round', 'stroke-opacity': 0.7 });
    el('path', { d: front, fill: 'none', stroke: '#0e6f86', 'stroke-width': 2, 'stroke-linecap': 'round' });
  }
  for (const [code, c] of Object.entries(AIR)) {
    const p = projection(c);
    if (!p || d3.geoDistance(c, [-rot[0], -rot[1]]) > Math.PI / 2 - 0.02) continue;
    el('circle', { cx: p[0], cy: p[1], r: 3.8, fill: '#fcfdfe', stroke: '#142e45', 'stroke-width': 1.8 });
  }
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
